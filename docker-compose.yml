version: '3.8'

services:
  db:
    image: postgres:15
    container_name: brewguru_db_cont
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: brewguru_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d brewguru_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: brewguru_app_cont
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/brewguru_db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./static:/app/static # Щоб фото не зникали при перезапуску

volumes:
  postgres_data:
